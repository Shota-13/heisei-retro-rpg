<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <title>RPG Prototype</title>
  </head>
  <body>
    <div id="app">
      <div id="game-frame">
        <div id="game"></div>
        <div id="wake-overlay" class="wake-overlay" aria-hidden="true">
          <div class="wake-lid wake-lid-top"></div>
          <div class="wake-lid wake-lid-bottom"></div>
          <div class="wake-glint"></div>
        </div>
        <div id="dialogue" class="dialogue-box" role="status" aria-live="polite" hidden>
          <div id="dialogue-speaker" class="dialogue-speaker"></div>
          <div id="dialogue-text" class="dialogue-text"></div>
          <form id="dialogue-name-form" class="dialogue-name-form" hidden>
            <input
              id="dialogue-name-input"
              class="dialogue-name-input"
              type="text"
              autocomplete="nickname"
              aria-label="あなたの名前"
              placeholder="名前を入力"
              required
            />
            <button class="dialogue-name-submit" type="submit">決定</button>
          </form>
        </div>
        <div id="game-ending" class="game-ending" role="status" aria-live="polite" hidden>
          <canvas class="game-ending-rain" aria-hidden="true"></canvas>
          <div class="game-ending-card" hidden>
            <p class="game-ending-message">ここまでしか作れてません!!<br />コツコツ作っていきます</p>
            <p class="game-ending-caption">6人全員と話しました</p>
          </div>
        </div>
      </div>

      <!-- スマホ用の操作盤(HTML/CSS)。PCでは非表示。?touch=1 でPCでも表示 -->
      <div id="controls" aria-label="操作盤">
        <div class="dpad" data-dpad>
          <div class="dpad-visual" data-dpad-visual>
            <img class="dpad-image" src="/assets/input-Xbox/Double/xbox_dpad.png" alt="" />
            <img class="dpad-image dpad-up" src="/assets/input-Xbox/Double/xbox_dpad_up.png" alt="" />
            <img class="dpad-image dpad-down" src="/assets/input-Xbox/Double/xbox_dpad_down.png" alt="" />
            <img class="dpad-image dpad-left" src="/assets/input-Xbox/Double/xbox_dpad_left.png" alt="" />
            <img class="dpad-image dpad-right" src="/assets/input-Xbox/Double/xbox_dpad_right.png" alt="" />
          </div>
        </div>

        <div class="ab">
          <button type="button" tabindex="-1" class="btn btn-b image-control" data-action="cancel" aria-label="B">
            <img class="image-default" src="/assets/input-Xbox/Double/xbox_button_color_b.png" alt="" />
            <img class="image-pressed" src="/assets/input-Xbox/Double/xbox_button_color_b_outline.png" alt="" />
          </button>
          <button type="button" tabindex="-1" class="btn btn-a image-control" data-action="confirm" aria-label="A">
            <img class="image-default" src="/assets/input-Xbox/Double/xbox_button_color_a.png" alt="" />
            <img class="image-pressed" src="/assets/input-Xbox/Double/xbox_button_color_a_outline.png" alt="" />
          </button>
        </div>

        <div class="meta">
          <button type="button" tabindex="-1" class="pill image-control" data-action="select" aria-label="BACK">
            <img class="image-default" src="/assets/input-Xbox/Double/xbox_button_back.png" alt="" />
            <img class="image-pressed" src="/assets/input-Xbox/Double/xbox_button_back_outline.png" alt="" />
          </button>
          <button type="button" tabindex="-1" class="pill image-control" data-action="menu" aria-label="START">
            <img class="image-default" src="/assets/input-Xbox/Double/xbox_button_start.png" alt="" />
            <img class="image-pressed" src="/assets/input-Xbox/Double/xbox_button_start_outline.png" alt="" />
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
